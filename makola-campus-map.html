<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makola Campus Map</title>
<meta name="description" content="Interactive map of the Ghana School of Law Makola campus, Accra.">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/map.css">
<link rel="stylesheet" href="assets/css/map-makola.css">
<script src="assets/js/icons.js" defer></script>
<script src="assets/js/map-core.js" defer></script>
<script src="assets/data/makola.js" defer></script>
<script src="assets/js/makola-map.js" defer></script>
</head>
<body>

<!-- Shared gradients for the pointer bodies. Referenced by fill:url(#id) in CSS. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c7d6a"/><stop offset="100%" stop-color="#124a3d"/>
    </linearGradient>
    <linearGradient id="gradGreenLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d9a84"/><stop offset="100%" stop-color="#17604f"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eeb254"/><stop offset="100%" stop-color="#b1741f"/>
    </linearGradient>
    <linearGradient id="gradRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9584f"/><stop offset="100%" stop-color="#982c25"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a90c2"/><stop offset="100%" stop-color="#22557a"/>
    </linearGradient>
  </defs>
</svg>

<header>
  <div class="wrap bar">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H6M11 5.5L5 12l6 6.5"/>
      </svg>
      <span>Campuses</span>
    </a>
    <div class="title"><h1>Makola Campus Map</h1></div>

    <button class="lbl-btn" id="btnLabels" type="button" aria-pressed="true" title="Show or hide the arrows and names">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.4 12.6 13 20a2 2 0 0 1-2.8 0l-6.6-6.6A2 2 0 0 1 3 12V5a2 2 0 0 1 2-2h7a2 2 0 0 1 1.4.6l7 7a2 2 0 0 1 0 2.8z"/>
        <circle cx="7.6" cy="7.6" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
      <span class="label">Labels</span>
    </button>

    <div class="browse">
      <button class="browse-btn" id="browseBtn" type="button" aria-expanded="false" aria-controls="browsePanel" aria-haspopup="listbox">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>
        </svg>
        <span class="label">Locations</span>
        <span class="badge" id="badge">0</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>

      <div class="panel" id="browsePanel" hidden>
        <div class="panel-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
          </svg>
          <input id="q" type="search" aria-label="Search places and offices" placeholder="Search a place or office&hellip;" autocomplete="off" aria-controls="list">
        </div>
        <ul id="list" role="listbox" aria-label="Campus locations"></ul>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <main>
    <p class="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 11.5V4.8a1.8 1.8 0 1 1 3.6 0v5.4"/>
        <path d="M12.6 10.6V9a1.7 1.7 0 1 1 3.4 0v1.9"/>
        <path d="M16 11.2v-.7a1.7 1.7 0 1 1 3.4 0V15a6 6 0 0 1-6 6h-1.7a6 6 0 0 1-5.2-3l-2.1-3.6a1.8 1.8 0 0 1 3-2l1.6 2"/>
      </svg>
      Click an arrow to see details about that location.
      <a class="campus-gps" href="https://www.google.com/maps?q=Ghana+School+of+Law,+Makola,+Accra"
         target="_blank" rel="noopener">Locate the campus on Google Map</a>
    </p>

    <div class="stage">
      <div class="canvas" id="canvas">
        <!-- .layer crops the plan's empty margin while keeping every
             coordinate in the original 1512 x 1036 space. -->
        <div class="layer">
          <img src="assets/img/makola/makola-campus-plan.webp" alt="Aerial plan of the Makola campus">
          <svg class="shapes" id="shapes" viewBox="0 0 1512 1036" aria-hidden="true"></svg>
          <div class="pins" id="pins"></div>
          <div class="svcpins" id="svcpins" hidden></div>
        </div>

        <div class="svc-bar">
          <button class="svc-btn clinic" id="btnClinic" type="button" aria-pressed="false" title="Show the campus clinic">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M10 2.6h4c.8 0 1.4.6 1.4 1.4v4.6H20c.8 0 1.4.6 1.4 1.4v4c0 .8-.6 1.4-1.4 1.4h-4.6V20c0 .8-.6 1.4-1.4 1.4h-4c-.8 0-1.4-.6-1.4-1.4v-4.6H4c-.8 0-1.4-.6-1.4-1.4v-4c0-.8.6-1.4 1.4-1.4h4.6V4c0-.8.6-1.4 1.4-1.4z"/>
            </svg>
            <span class="label">Clinic</span>
          </button>
          <button class="svc-btn washroom" id="btnWc" type="button" aria-pressed="false" title="Show every washroom">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <circle cx="6.6" cy="4.2" r="2.1"/>
              <path d="M4.3 7.9h4.6c.7 0 1.2.6 1.1 1.3l-.9 4.2H8.2v7.2c0 .5-.4.9-.9.9H5.9c-.5 0-.9-.4-.9-.9v-7.2H4.1l-.9-4.2c-.1-.7.4-1.3 1.1-1.3z"/>
              <circle cx="17.4" cy="4.2" r="2.1"/>
              <path d="M17.4 7.9c1.7 0 2.7 1 3.1 2.4l1.1 3.9c.1.5-.2.9-.7.9h-1v5.5c0 .5-.4.9-.9.9h-3.2c-.5 0-.9-.4-.9-.9v-5.5h-1c-.5 0-.8-.4-.7-.9l1.1-3.9c.4-1.4 1.4-2.4 3.1-2.4z"/>
            </svg>
            <span class="label">Washrooms</span>
          </button>
        </div>

        <div class="info" id="info" role="dialog" aria-labelledby="info-title" hidden></div>
      </div>
    </div>
  </main>
</div>

</body>
</html>
