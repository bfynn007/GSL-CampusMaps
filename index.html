<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghana School of Law Campus Maps</title>
<meta name="description" content="Interactive maps of every Ghana School of Law campus. Find your lecture hall, the registry, the clinic and every washroom.">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/home.css">
<script src="assets/js/icons.js" defer></script>
<script src="assets/data/campuses.js" defer></script>
<script src="assets/js/home.js" defer></script>
</head>
<body>

<!-- The pointer gradient and shape, so the homepage speaks the same visual
     language as the maps themselves. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c7d6a"/><stop offset="100%" stop-color="#124a3d"/>
    </linearGradient>
    <symbol id="pinArrow" viewBox="0 0 30 34">
      <path d="M15 32.4c-.9 0-1.5-.5-1.9-1.1L4.3 16.2C1.7 12 4.7 6.2 9.6 6.2h10.8c4.9 0 7.9 5.8 5.3 10L16.9 31.3c-.4.6-1 1.1-1.9 1.1z"
            stroke="#fffdf7" stroke-width="1.6"/>
      <circle cx="15" cy="14.2" r="3.6" fill="#fffdf7" opacity=".95" stroke="none"/>
    </symbol>
  </defs>
</svg>

<header>
  <div class="wrap bar">
    <span class="crest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6.4l6-2.2 6 2.2 6-2.2v13.4l-6 2.2-6-2.2-6 2.2z"/><path d="M9 4.2v15.4M15 6.4v15.4"/>
      </svg>
    </span>
    <strong>Ghana School of Law</strong>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap hero-grid">

      <div class="hero-copy">
        <h1>Find your way around campus.</h1>
        <p class="deck">Interactive maps of every Ghana School of Law campus. Find your lecture
           hall, the registry, the clinic and every washroom, without having to ask.</p>
        <a class="hero-cta" href="#campuses">
          Choose your campus
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v13M6.5 12.5 12 18l5.5-5.5"/>
          </svg>
        </a>
      </div>

      <!-- An illustrated plan that belongs to no campus in particular, so the
           homepage does not favour one over the others. Drawn in the same
           vocabulary the real maps use: paths, blocks, planting, water. -->
      <div class="hero-figure">
        <div class="hero-stage">
          <div class="hero-canvas" id="heroCanvas">
            <svg class="hero-plan" viewBox="0 0 400 480" aria-hidden="true">
              <rect width="400" height="480" fill="#efe8da"/>

              <!-- campus boundary -->
              <path d="M30 450 L22 168 L120 58 L300 44 L376 134 L364 372 L286 456 Z"
                    fill="#f6f1e5" stroke="#cec4ac" stroke-width="1.6" stroke-dasharray="7 6"/>

              <!-- roads, drawn as casing then surface -->
              <g fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M-10 432 C70 422 120 360 132 286 C142 214 212 172 410 168" stroke="#d5cab3" stroke-width="31"/>
                <path d="M-10 432 C70 422 120 360 132 286 C142 214 212 172 410 168" stroke="#e9e1cf" stroke-width="24"/>
                <path d="M132 286 C210 300 268 318 410 304" stroke="#d5cab3" stroke-width="21"/>
                <path d="M132 286 C210 300 268 318 410 304" stroke="#e9e1cf" stroke-width="15"/>
              </g>

              <!-- footpaths -->
              <g fill="none" stroke="#cfc4ac" stroke-width="3" stroke-dasharray="5 7" stroke-linecap="round">
                <path d="M196 132 L234 214 L300 234"/>
                <path d="M234 214 L188 302"/>
              </g>

              <!-- planted quad with a water feature -->
              <rect x="214" y="150" width="94" height="74" rx="14" fill="#d3e2cb"/>
              <rect x="242" y="176" width="42" height="23" rx="11" fill="#bcd6e4"/>

              <!-- parking bays -->
              <rect x="230" y="390" width="72" height="38" rx="4" fill="#e4dcc9" stroke="#c6bba3" stroke-width="1.3"/>
              <g fill="none" stroke="#cec3ab" stroke-width="1.3">
                <path d="M230 403h72M230 415h72M254 390v38M278 390v38"/>
              </g>

              <!-- buildings -->
              <g stroke="#bcb197" stroke-width="1.5">
                <rect x="150" y="86" width="86" height="46" rx="5" fill="#dbd2bc"/>
                <rect x="258" y="74" width="62" height="60" rx="5" fill="#d2c8ae"/>
                <rect x="300" y="198" width="54" height="86" rx="5" fill="#dbd2bc"/>
                <rect x="60" y="196" width="62" height="52" rx="5" fill="#d2c8ae"/>
                <rect x="196" y="330" width="106" height="52" rx="5" fill="#dbd2bc"/>
                <rect x="70" y="332" width="54" height="72" rx="5" fill="#d2c8ae"/>
                <rect x="118" y="256" width="46" height="40" rx="5" fill="#dbd2bc"/>
              </g>
              <!-- roof ridges, the way a plan drawing marks them -->
              <g fill="none" stroke="#b0a48a" stroke-width="1.4">
                <path d="M150 109h86M196 356h106M300 241h54M70 368h54M258 104h62"/>
              </g>

              <!-- tree canopies -->
              <g fill="#c3d7ba">
                <circle cx="330" cy="330" r="17"/><circle cx="352" cy="352" r="12"/><circle cx="314" cy="360" r="13"/>
                <circle cx="96" cy="126" r="15"/><circle cx="120" cy="150" r="10"/>
                <circle cx="62" cy="288" r="12"/><circle cx="84" cy="272" r="8"/>
                <circle cx="344" cy="150" r="13"/><circle cx="356" cy="176" r="9"/>
                <circle cx="152" cy="428" r="14"/><circle cx="178" cy="444" r="10"/>
                <circle cx="60" cy="150" r="9"/><circle cx="196" cy="286" r="10"/>
                <circle cx="222" cy="296" r="7"/><circle cx="368" cy="256" r="10"/>
              </g>
            </svg>

            <span class="hero-pin" style="left:72.25%; top:21.67%; --d:0ms">
              <span class="hero-bob"><svg class="hero-arrow" aria-hidden="true"><use href="#pinArrow"/></svg></span>
              <span class="hero-ground"></span>
            </span>

            <span class="hero-pin" style="left:22.75%; top:46.25%; --d:420ms">
              <span class="hero-bob"><svg class="hero-arrow" aria-hidden="true"><use href="#pinArrow"/></svg></span>
              <span class="hero-ground"></span>
            </span>

            <span class="hero-pin" style="left:62.25%; top:74.17%; --d:840ms">
              <span class="hero-bob"><svg class="hero-arrow" aria-hidden="true"><use href="#pinArrow"/></svg></span>
              <span class="hero-ground"></span>
            </span>
          </div>
        </div>
      </div>

    </div>
  </section>

  <section class="campuses wrap" id="campuses">
    <h2>Choose your campus</h2>
    <!-- Cards are built by assets/js/home.js from assets/data/campuses.js -->
    <div class="grid" id="grid"></div>
    <div class="upcoming" id="upcoming" hidden></div>
  </section>
</main>

</body>
</html>
